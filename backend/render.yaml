services:
  - type: web
    name: vaultrag-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements-min.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaultrag-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_TLS
        value: "true"
      - key: MAIL_SSL
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.7"

databases:
  - name: vaultrag-db
    plan: free
    region: oregon
    databaseName: vaultrag
    user: vaultrag_user
